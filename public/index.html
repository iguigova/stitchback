<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>localstate</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <main>
      <h1>localstate <span id="replica"></span></h1>
      <p>
        Edit the local copy, save it, and sync when you choose. Open
        <a id="other" href="?replica=b">another replica</a> in a second tab
        to make a concurrent edit.
      </p>

      <label for="url">Resource URL</label>
      <input id="url" type="url" value="http://localhost:3000/posts">
      <button id="load" type="button">Load</button>

      <label for="body">Local copy (JSON)</label>
      <textarea id="body" spellcheck="false"
                aria-describedby="status"></textarea>
      <div class="actions">
        <button id="save" type="button">Save locally</button>
        <button id="sync" type="button">Sync</button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <h2>Conflicts</h2>
      <ul id="conflicts"><li>None.</li></ul>
    </main>

    <script type="module" src="index.js"></script>
  </body>
</html>
